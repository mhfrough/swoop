<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Long test page</title>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; font: 16px system-ui; }
    header { position: sticky; top: 0; height: 60px; background: #1d3557; color: #fff; z-index: 5; }
    .band { position: relative; height: 600px; }
    .reveal { position: absolute; left: 100px; top: 100px; width: 300px; height: 100px; background: #2a9d8f; opacity: 0; transition: opacity 1.4s linear; }
    .reveal.in { opacity: 1; }
    .lazy { position: absolute; left: 500px; top: 100px; width: 100px; height: 100px; }
    footer { height: 100px; background: #264653; }
    .cookie { position: fixed; left: 0; right: 0; bottom: 0; height: 50px; background: #e63946; z-index: 6; }
  </style>
</head>
<body>
  <header>Sticky header</header>
  <main id="bands"></main>
  <footer></footer>
  <div class="cookie">Cookie bar</div>
  <script>
    const colors = ['#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff', '#fffffc'];
    const main = document.getElementById('bands');
    colors.forEach((c, i) => {
      const b = document.createElement('section');
      b.className = 'band';
      b.style.background = c;
      b.innerHTML = '<div class="reveal"></div>' + (i === 6 ? '<img class="lazy" loading="lazy" src="swatch.svg" width="100" height="100" alt="">' : '');
      main.appendChild(b);
    });
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }));
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
  </script>
</body>
</html>
