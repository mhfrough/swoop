[package]
name = "swoop"
version = "0.1.1"
description = "Swoop: press Print Screen, select an area, mark it up and save."
authors = ["Mohammad Hamza"]
license = "MIT"
repository = "https://github.com/mhfrough/swoop"
edition = "2021"
rust-version = "1.80"

[lib]
name = "swoop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Small, fast release builds
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
