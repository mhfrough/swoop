# Release: builds the desktop installers (Windows .exe; Linux .deb, .rpm and .AppImage) and the
# Chrome extension zip. A version tag (v0.1.0) publishes them as a GitHub release; running it by hand
# only builds them, so you can try the files from the run's artifacts first.
#
# Every file is attached twice: with its version in the name, and with a fixed name that the landing
# page links to through /releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/zip-extension.mjs
      - run: cp dist/swoop-chrome-*.zip dist/swoop-chrome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux libraries (web view, tray, screen capture, clipboard)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file \
            libxdo-dev libssl-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libclang-dev

      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run sync
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect the installers
        run: |
          mkdir -p out
          b=desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            f=$(ls $b/nsis/*-setup.exe); cp "$f" out/; cp "$f" out/Swoop-setup.exe
          else
            f=$(ls $b/deb/*.deb); cp "$f" out/; cp "$f" out/swoop_amd64.deb
            f=$(ls $b/rpm/*.rpm); cp "$f" out/; cp "$f" out/swoop.x86_64.rpm
            f=$(ls $b/appimage/*.AppImage); cp "$f" out/; cp "$f" out/Swoop.AppImage
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          name: Swoop ${{ github.ref_name }}
          generate_release_notes: true
          files: files/*
