<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swoop</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="editor/editor.css">
  <link rel="stylesheet" href="editor-page.css">
</head>
<body>
  <header class="top">
    <span class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="mark-tile"/><path class="mark-line" d="M9.5 8.5c0 8.5 4.5 13.5 13 13.5"/><path class="mark-line" d="m18.5 17.75 4.25 4.25-4.25 4.25"/></svg>
      <span class="brand-name">Swoop</span>
    </span>
    <div class="meta">
      <h1 class="page-title"><input id="title" class="title-input" value="Loading the capture" readonly spellcheck="false" autocomplete="off" aria-label="Name of this capture, also used as the file name"></h1>
      <p class="page-info"><a id="source" href="#" target="_blank" rel="noopener noreferrer" hidden></a> <span id="dims" class="num"></span></p>
    </div>
    <a class="settings" href="options.html" target="_blank">Settings</a>
  </header>
  <main id="main" class="main">
    <div id="editor" class="editor"></div>
    <div id="message" class="message" hidden>
      <h2 id="message-title">Nothing to show</h2>
      <p id="message-text"></p>
    </div>
  </main>
  <script src="store.js"></script>
  <script src="editor/editor.js"></script>
  <script src="editor-page.js"></script>
</body>
</html>
